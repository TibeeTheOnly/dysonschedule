<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Dyson Pi · Login</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body class="login-body">
<main class="login">
  <h1>Dyson Pi</h1>
  <p class="muted">Vis Nav button pusher</p>
  <form id="f" class="card">
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required autofocus>
    <button class="btn primary big" type="submit">Log in</button>
    <p id="err" class="error" role="alert"></p>
  </form>
</main>
<script>
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('err');
  err.textContent = '';
  try {
    const r = await fetch('/api/login', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({password: document.getElementById('pw').value}),
    });
    if (r.ok) { location.href = '/'; return; }
    const j = await r.json().catch(() => ({}));
    err.textContent = j.detail || ('Login failed (' + r.status + ')');
  } catch (ex) { err.textContent = 'Cannot reach the Pi: ' + ex; }
});
</script>
</body>
</html>
