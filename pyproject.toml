[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dyson-pi"
version = "1.0.0"
description = "Raspberry Pi controlled pneumatic button pusher for a Dyson Vis Nav 360"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "tzdata",            # zoneinfo database for platforms without /usr/share/zoneinfo
]

[project.optional-dependencies]
# On the Pi these come from apt (python3-gpiozero, python3-lgpio) via a
# --system-site-packages venv; listed here for completeness.
gpio = ["gpiozero>=2.0", "lgpio>=0.2"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
dysonctl = "dyson_pi.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dyson_pi = ["web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
